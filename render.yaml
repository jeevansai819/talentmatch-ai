services:
  - type: web
    name: talentmatch-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentmatch-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: talentmatch-db
    databaseName: talentmatch
    user: talentmatch
    plan: free
    region: oregon
