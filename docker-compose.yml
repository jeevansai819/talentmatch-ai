version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: talentmatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: talentmatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentmatch_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=TalentMatch AI
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=supersecret-production-talentmatch-key-must-be-changed
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/talentmatch
      - UPLOAD_DIR=./uploads
      - MAX_UPLOAD_SIZE_MB=10
      - WEIGHT_REQUIRED_SKILLS=40
      - WEIGHT_PREFERRED_SKILLS=20
      - WEIGHT_EXPERIENCE=20
      - WEIGHT_EDUCATION=10
      - WEIGHT_TEXT_SIMILARITY=10
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
